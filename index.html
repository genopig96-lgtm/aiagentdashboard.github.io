<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Agent Dashboard — Tháng 07/2026</title><style>:root{--paper:#f4f7fb;--card:#fff;--line:#dfe6ef;--ink:#26334d;--soft:#71809a;--shadow:0 10px 28px -22px rgba(39,55,86,.38),0 2px 8px rgba(55,70,100,.06)}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden}.export-shell{max-width:1500px;margin:0 auto;padding:16px 18px 28px}.export-title{font-size:1.1rem;font-weight:900;margin:0 0 12px}.export-tabs{display:inline-flex;gap:4px;padding:4px;margin:12px 0;background:#edf2f8;border:1px solid var(--line);border-radius:999px}.export-tabs button{border:0;background:transparent;color:var(--soft);padding:7px 14px;border-radius:999px;font-size:.75rem;font-weight:800;cursor:pointer}.export-tabs button.active{background:#fff;color:#4d6f9e;box-shadow:0 3px 10px rgba(69,88,120,.10)}.export-frame{display:none;width:100%;height:900px;border:0;background:var(--paper);overflow:hidden}.export-frame.active{display:block}@media(max-width:620px){.export-shell{padding:10px}.export-tabs{display:flex;width:100%}.export-tabs button{flex:1;padding:7px 8px}}</style><style>
  :root{
    --ink:#161b22; --ink-soft:#5b6472; --paper:#f2f4f7; --card:#ffffff; --line:#e7eaef; --line-strong:#d7dce3;
    --self:#1f8a4c; --self-bg:#e7f5ec; --self-ink:#166238;
    --autosr:#215fce; --autosr-bg:#eaf0fd; --autosr-ink:#1b4aa0;
    --agent:#c85a15; --agent-bg:#fbede1; --agent-ink:#9c460f;
    --other:#6b7683; --other-bg:#eff1f4;
    --fpt:#e8601a;
    --sans:'Be Vietnam Pro',-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    --mono:'IBM Plex Mono',Consolas,Monaco,monospace;
    --shadow:0 1px 2px rgba(20,28,38,.04), 0 8px 20px -6px rgba(20,28,38,.09);
    --shadow-sm:0 1px 2px rgba(20,28,38,.05);
    --radius:16px;
  }
  html{scroll-behavior:smooth;scroll-padding-top:64px;}
  body{font-family:var(--sans);background:
    radial-gradient(900px 420px at 100% -8%,rgba(33,95,206,.05),transparent 60%),
    radial-gradient(700px 360px at -5% 0%,rgba(31,138,76,.05),transparent 55%),
    var(--paper);
    color:var(--ink);}
  .num,td.num,.rep td:not(:first-child){font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .brandbar{height:4px;background:linear-gradient(90deg,var(--self) 0 33%,var(--autosr) 33% 66%,var(--agent) 66% 100%);}
  .eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:#8b95a3;}
  h1{font-family:var(--sans);letter-spacing:-.02em;font-weight:800;}
  h1 .badge-daisy{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--self),var(--autosr));padding:5px 11px;border-radius:999px;vertical-align:middle;margin-right:10px;}
  h2,h3{font-family:var(--sans);letter-spacing:-.01em;}
  h2.h6, h3.h6{letter-spacing:-.005em;}
  h2.h5{font-size:1.2rem;font-weight:800;}

  .kpi{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--autosr);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,transform .15s ease;}
  .kpi:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .kpi .v{font-family:var(--mono);font-size:1.7rem;font-weight:700;line-height:1.2;letter-spacing:-.01em;}
  .kpi .t{font-size:.75rem;color:var(--ink-soft);margin-bottom:3px;font-weight:600;}

  .card-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:18px;box-shadow:var(--shadow);scroll-margin-top:64px;}
  .card-sec h2, .card-sec h3{color:var(--ink);}

  .stackbar{display:flex;height:36px;border-radius:9px;overflow:hidden;font-size:.74rem;color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);}
  .stackbar>div{display:flex;align-items:center;justify-content:center;white-space:nowrap;min-width:0;font-family:var(--mono);}
  .legend .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;}

  table.rep{width:100%;font-size:.85rem;border-collapse:separate;border-spacing:0;}
  table.rep th{font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:#8b95a3;font-weight:600;border-bottom:2px solid var(--line-strong);padding:9px 11px;text-align:left;}
  table.rep td{padding:9px 11px;border-bottom:1px solid var(--line);}
  table.rep tbody tr:hover td{background:#f8f9fb;}
  tr.grp td{font-weight:700;}
  tr.grp.g11 td{background:var(--self-bg);color:var(--self-ink);} tr.grp.g11 td:first-child{color:var(--ink);}
  tr.grp.g12 td{background:var(--autosr-bg);color:var(--autosr-ink);} tr.grp.g12 td:first-child{color:var(--ink);}
  tr.grp.g13 td{background:var(--agent-bg);color:var(--agent-ink);} tr.grp.g13 td:first-child{color:var(--ink);}
  tr.grp.g14 td{background:var(--other-bg);}
  tr.total td{font-weight:800;background:#eef1f6;border-top:2px solid var(--line-strong);border-bottom:2px solid var(--line-strong);}
  tr.grp:hover td, tr.total:hover td{background-color:inherit;}
  tr.child td:first-child{padding-left:30px;color:var(--ink-soft);font-weight:500;}

  .pctbar{position:relative;background:#eef1f5;border-radius:4px;height:13px;min-width:110px;overflow:hidden;}
  .pctbar>i{position:absolute;inset:0 auto 0 0;border-radius:4px;}
  .daybar{display:flex;align-items:flex-end;gap:10px;height:120px;}
  .daybar .col-b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .daybar .bar{width:70%;background:var(--autosr);border-radius:4px 4px 0 0;}
  .daybar .lbl{font-size:.68rem;color:var(--ink-soft);font-family:var(--mono);}
  .cov-badge{font-size:.71rem;font-family:var(--mono);}

  .dropzone{border:1.5px dashed #c4ccd6;border-radius:14px;padding:22px 18px;text-align:center;background:#fbfcfd;cursor:pointer;transition:border-color .15s ease,background .15s ease,box-shadow .15s ease;}
  .dropzone:hover{border-color:var(--autosr);box-shadow:0 0 0 3px rgba(33,95,206,.06);}
  .dropzone.drag{border-color:var(--fpt);background:#fff6f1;box-shadow:0 0 0 3px rgba(232,96,26,.08);}
  .dropzone-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:13px;}
  .dropzone-actions .btn{min-width:126px;}
  .folder-rule{margin-top:10px;padding:9px 12px;border-radius:10px;background:#f4f7fc;border:1px solid #e1e8f3;text-align:left;}
  .folder-picker-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;}
  .folder-picker-wrap input[type="file"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px;}
  .folder-rule code{white-space:nowrap;}
  .note{font-size:.78rem;color:var(--ink-soft);line-height:1.6;}
  .note code{background:#eef1f6;color:#3a4453;padding:1px 5px;border-radius:5px;font-size:.92em;}

  .topic-tabs{display:flex;flex-direction:column;gap:10px;}
  .tab-group{display:flex;align-items:flex-start;gap:12px;}
  .tab-group-label{flex:0 0 128px;padding-top:8px;font-family:var(--mono);font-size:.63rem;letter-spacing:.08em;
    text-transform:uppercase;font-weight:600;color:#9aa3b0;line-height:1.3;}
  .tab-group-items{display:flex;flex-wrap:wrap;gap:7px;flex:1;min-width:0;}
  .topic-tab.is-empty{opacity:.45;}
  .topic-tab.is-empty.active{opacity:1;}
  @media(max-width:820px){.tab-group{flex-direction:column;gap:4px}.tab-group-label{flex:none;padding-top:0}}
  .topic-tab{border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;color:#344050;font-size:.85rem;transition:all .12s ease;}
  .topic-tab:hover{border-color:var(--fpt);}
  .topic-tab.active{background:var(--fpt);border-color:var(--fpt);color:#fff;box-shadow:0 3px 10px -2px rgba(232,96,26,.45);}
  .topic-tab .small{font-weight:600;opacity:.82;font-family:var(--mono);}

  details>summary{cursor:pointer;font-size:.81rem;font-weight:700;color:var(--autosr);list-style:none;}
  details>summary::-webkit-details-marker{display:none;}
  details>summary::before{content:"▸ ";display:inline-block;transition:transform .15s ease;}
  details[open]>summary::before{content:"▾ ";}
  details[open]>summary{margin-bottom:2px;}

  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;height:100%;}
  .chart-card.channel-card{cursor:pointer;transition:box-shadow .15s ease,border-color .15s ease;}
  .chart-card.channel-card:hover{box-shadow:var(--shadow);border-color:var(--line-strong);}
  .chart-title{font-size:.82rem;font-weight:700;color:var(--ink);margin-bottom:12px;}
  .cmp-up{color:var(--self);font-weight:700;}
  .cmp-down{color:#c0392b;font-weight:700;}
  .chart-wrap{position:relative;height:260px;}

  .jumpnav{position:sticky;top:0;z-index:20;background:rgba(242,244,247,.94);backdrop-filter:saturate(180%) blur(10px);border:1px solid var(--line-strong);border-radius:12px;margin-bottom:18px;padding:9px 14px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
  .jumpnav a{font-size:.76rem;font-weight:600;color:var(--ink-soft);text-decoration:none;padding:5px 10px;border-radius:7px;white-space:nowrap;}
  .jumpnav a:hover{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);}

  .btn-outline-secondary{font-weight:600;border-color:var(--line-strong);}
  ::-webkit-scrollbar{height:9px;width:9px;} ::-webkit-scrollbar-thumb{background:#d3d9e0;border-radius:99px;} ::-webkit-scrollbar-thumb:hover{background:#b9c1cb;}


  .data-update-bar{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#fffdfd,#f7fbff);}
  .data-update-bar .control{min-width:190px;}
  .data-update-bar label{display:block;font-size:.7rem;font-weight:800;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  .data-update-bar .form-select{font-size:.78rem;}
  .storage-actions{display:flex;flex-wrap:wrap;gap:6px;}
  .storage-status{font-size:.74rem;color:var(--ink-soft);line-height:1.45;flex-basis:100%;}
  .storage-status.ok{color:#27745a}.storage-status.warn{color:#a96313}.storage-status.err{color:#b54747}
  .import-warning{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff6e8;border:1px solid #f2d7aa;color:#8a5a13;font-size:.75rem;line-height:1.5;}
  .import-warning:empty{display:none;}

  .control-center{padding:14px 16px;}
  .control-menu{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:12px;background:#f7f9fc;}
  .control-menu .btn{border-color:#d9e1ec;background:#fff;color:#536681;font-size:.73rem;font-weight:700;}
  .control-menu .btn.active{background:#eaf2fd;border-color:#a9c4e9;color:#416d9f;box-shadow:0 2px 8px rgba(65,109,159,.08);}
  .control-menu .btn .chip-status{display:inline-block;margin-left:7px;padding-left:7px;border-left:1px solid #dde5f0;
    font-weight:600;font-size:.69rem;color:#8794a8;font-family:var(--mono);max-width:210px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;}
  .control-menu .btn .chip-status:empty{display:none;}
  .control-panels{display:grid;gap:9px;margin-top:9px;}
  details.control-panel{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;}
  /* Chip ở trên đã đóng vai trò menu. Trước đây mỗi panel còn hiện thêm 1 dòng summary trải rộng
     => 5 chip + 5 dòng trùng tên, tốn ~300px trước khi tới nội dung. Panel đóng nay ẩn hoàn toàn. */
  details.control-panel:not([open]){display:none;}
  details.control-panel>summary{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 13px;list-style:none;cursor:pointer;font-size:.76rem;font-weight:800;color:#52657f;}
  details.control-panel>summary::-webkit-details-marker{display:none;}
  details.control-panel>summary::before{content:"⌄";font-size:.95rem;color:#8aa2c0;}
  details.control-panel[open]>summary{border-bottom:1px solid var(--line);background:#f8fafc;}
  .control-panel-body{padding:12px 13px;}
  .control-summary-text{margin-left:auto;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#7b879a;text-align:right;}
  .compact-controls{display:flex;flex-wrap:wrap;align-items:end;gap:10px;}
  .compact-controls .control{min-width:165px;}
  .compact-controls label{display:block;font-size:.68rem;font-weight:800;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.035em;}
  select option:disabled{color:#b7c0cd;background:#f3f5f8;}
  .period-unavailable-note{font-size:.68rem;color:#8a96a8;margin-top:6px;}
  .control-panel .period-manager,.control-panel .package-manager{
    flex-basis:auto;margin:0;padding:0;border:0;background:transparent;
  }
  .warning-always{margin-top:9px;}
  .compare-period-head{font-size:.68rem;line-height:1.35;max-width:190px;white-space:normal;}

  /* ===== Tool failure & stamp monitoring ===== */
  .tool-health-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;margin-bottom:14px;}
  .tool-health-filters .control{min-width:165px;}
  .tool-health-filters .control.grow{flex:1 1 260px;}
  .tool-health-filters label{display:block;font-size:.67rem;font-weight:800;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  .tool-health-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  .tool-health-kpi{border:1px solid var(--line);border-left:3px solid #91a4bd;border-radius:11px;padding:13px 14px;background:#fff;box-shadow:var(--shadow-sm);}
  .tool-health-kpi.fail{border-left-color:#d0605b;}
  .tool-health-kpi.missing{border-left-color:#e0a34a;}
  .tool-health-kpi.invalid{border-left-color:#9a78cb;}
  .tool-health-kpi.good{border-left-color:var(--self);}
  .tool-health-kpi .label{font-size:.7rem;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .tool-health-kpi .value{font:700 1.55rem/1.1 var(--mono);color:var(--ink);}
  .tool-health-kpi .sub{font-size:.67rem;color:var(--ink-soft);margin-top:4px;}
  .tool-health-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:.67rem;font-weight:800;white-space:nowrap;}
  .tool-health-badge.fail{background:#fdebea;color:#a3433f;}
  .tool-health-badge.missing{background:#fff2da;color:#95631b;}
  .tool-health-badge.invalid{background:#f1eafa;color:#7555a5;}
  .tool-health-badge.valid{background:#e7f6ef;color:#31775f;}
  .tool-health-badge.other{background:#edf1f6;color:#6f7e92;}
  .tool-health-section{margin-top:16px;}
  .tool-health-section h3{display:flex;align-items:center;gap:8px;}
  .tool-health-table-wrap{max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:11px;}
  .tool-health-table-wrap table{margin:0;}
  .tool-health-table-wrap thead th{position:sticky;top:0;z-index:3;background:#f3f6fa;}
  .tool-status-cell{max-width:520px;white-space:normal;word-break:break-word;font-family:var(--mono);font-size:.7rem;}
  .tool-name-cell{max-width:330px;word-break:break-word;}
  @media(max-width:1000px){.tool-health-kpis{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:620px){.tool-health-kpis{grid-template-columns:1fr;}}

  @media print{.no-print,.jumpnav{display:none!important;}body{background:#fff;}.card-sec{border:none;box-shadow:none;padding:8px 0;}}

  /* ===== Pastel operations dashboard ===== */
  :root{
    --ink:#26334d; --ink-soft:#71809a; --paper:#f4f7fb; --card:#ffffff;
    --line:#e5eaf2; --line-strong:#d8dfeb;
    --self:#57b894; --self-bg:#eaf8f2; --self-ink:#28775c;
    --autosr:#6d9fe8; --autosr-bg:#edf4ff; --autosr-ink:#416fae;
    --agent:#f2a36f; --agent-bg:#fff2e9; --agent-ink:#ad6337;
    --other:#a9b4c6; --other-bg:#f1f4f8; --fpt:#f39a70;
    --shadow:0 10px 28px -22px rgba(39,55,86,.38),0 2px 8px rgba(55,70,100,.05);
    --shadow-sm:0 4px 14px -10px rgba(39,55,86,.25);
  }
  body{background:linear-gradient(180deg,#f7f9fc 0%,#f2f6fb 55%,#f8fafc 100%);}
  .brandbar{height:5px;background:linear-gradient(90deg,#8ed8d1,#7fc8e8,#a8a4e6,#f2bd83,#f6a884);}
  h1 .badge-daisy{background:linear-gradient(135deg,#76cfc5,#7aaee8);box-shadow:0 8px 18px -14px rgba(79,129,190,.6);}
  .card-sec,.chart-card{border-color:var(--line);box-shadow:var(--shadow);}
  .topic-tab.active{background:#8da9df;border-color:#8da9df;box-shadow:none;}
  .jumpnav{background:rgba(248,250,253,.93);border-color:var(--line);}
  .dropzone{background:#fbfcfe;border-color:#cfd9e8;}
  .dropzone:hover{border-color:#90b1df;box-shadow:0 0 0 3px rgba(126,165,221,.10);}

  .ops-dashboard{display:grid;gap:14px;}
  .ops-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
  .ss-kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  /* Thẻ KPI: nền trắng + viền trái mang NGHĨA, đồng bộ với stackbar/donut (xanh lá = Selfservice,
     xanh dương = AutoSR, cam = SOC Agent). Nền tô đậm chỉ dùng khi vượt ngưỡng cảnh báo,
     để màu mã hoá trạng thái chứ không phải trang trí. */
  .ops-kpi{position:relative;min-height:126px;border-radius:12px;padding:16px 18px 12px;overflow:hidden;
    background:var(--card);border:1px solid var(--line);border-left:3px solid #9aa8bb;
    box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,transform .15s ease;}
  .ops-kpi:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .ops-kpi.tone-neutral{border-left-color:#9aa8bb;}
  .ops-kpi.tone-self{border-left-color:var(--self);}
  .ops-kpi.tone-autosr{border-left-color:var(--autosr);}
  .ops-kpi.tone-agent{border-left-color:var(--agent);}
  .ops-kpi.tone-alert{border-left-color:#c0392b;background:#fdf3f2;border-color:#f2d5d1;}
  .ops-kpi.tone-alert .value{color:#a5342a;}
  .ops-kpi .label{font-size:.72rem;font-weight:700;color:var(--ink-soft);margin-bottom:7px;}
  .ops-kpi .value{font:700 1.95rem/1.05 var(--mono);letter-spacing:-.04em;color:var(--ink);}
  .ops-kpi .sub{font-size:.7rem;color:var(--ink-soft);margin-top:5px;}
  .ops-kpi .spark{height:40px;margin-top:5px;}
  .ops-panel{background:#fff;border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);padding:16px 17px;min-width:0;}
  .ops-panel-title{font-size:.8rem;font-weight:700;color:#617795;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .ops-main-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(290px,1fr);gap:14px;}
  .ops-bottom-grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,1.45fr) minmax(220px,1fr) minmax(220px,1fr);gap:14px;}
  .ops-chart-lg{height:275px;position:relative;}
  .ops-chart-md{height:225px;position:relative;}
  .ops-chart-sm{height:185px;position:relative;}
  .ss-equal-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;}
  .ss-summary-grid{display:grid;grid-template-columns:minmax(230px,.9fr) minmax(0,1.35fr) minmax(280px,1fr);gap:14px;}
  .ss-health-wrap{overflow:auto;}
  .ss-health-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.76rem;}
  .ss-health-table th{padding:9px 10px;border-bottom:1px solid #e5eaf1;color:#69788e;font-weight:700;white-space:nowrap;}
  .ss-health-table td{padding:10px;border-bottom:1px solid #edf1f5;vertical-align:middle;}
  .ss-health-table tbody tr:last-child td{border-bottom:0;}
  .ss-rate-cell{min-width:145px;}

  .kpi{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--autosr);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,transform .15s ease;}
  .kpi:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .kpi .v{font-family:var(--mono);font-size:1.7rem;font-weight:700;line-height:1.2;letter-spacing:-.01em;}
  .kpi .t{font-size:.75rem;color:var(--ink-soft);margin-bottom:3px;font-weight:600;}

  .card-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:18px;box-shadow:var(--shadow);scroll-margin-top:64px;}
  .card-sec h2, .card-sec h3{color:var(--ink);}

  .stackbar{display:flex;height:36px;border-radius:9px;overflow:hidden;font-size:.74rem;color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);}
  .stackbar&gt;div{display:flex;align-items:center;justify-content:center;white-space:nowrap;min-width:0;font-family:var(--mono);}
  .legend .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;}

  table.rep{width:100%;font-size:.85rem;border-collapse:separate;border-spacing:0;}
  table.rep th{font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:#8b95a3;font-weight:600;border-bottom:2px solid var(--line-strong);padding:9px 11px;text-align:left;}
  table.rep td{padding:9px 11px;border-bottom:1px solid var(--line);}
  table.rep tbody tr:hover td{background:#f8f9fb;}
  tr.grp td{font-weight:700;}
  tr.grp.g11 td{background:var(--self-bg);color:var(--self-ink);} tr.grp.g11 td:first-child{color:var(--ink);}
  tr.grp.g12 td{background:var(--autosr-bg);color:var(--autosr-ink);} tr.grp.g12 td:first-child{color:var(--ink);}
  tr.grp.g13 td{background:var(--agent-bg);color:var(--agent-ink);} tr.grp.g13 td:first-child{color:var(--ink);}
  tr.grp.g14 td{background:var(--other-bg);}
  tr.total td{font-weight:800;background:#eef1f6;border-top:2px solid var(--line-strong);border-bottom:2px solid var(--line-strong);}
  tr.grp:hover td, tr.total:hover td{background-color:inherit;}
  tr.child td:first-child{padding-left:30px;color:var(--ink-soft);font-weight:500;}

  .pctbar{position:relative;background:#eef1f5;border-radius:4px;height:13px;min-width:110px;overflow:hidden;}
  .pctbar&gt;i{position:absolute;inset:0 auto 0 0;border-radius:4px;}
  .daybar{display:flex;align-items:flex-end;gap:10px;height:120px;}
  .daybar .col-b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .daybar .bar{width:70%;background:var(--autosr);border-radius:4px 4px 0 0;}
  .daybar .lbl{font-size:.68rem;color:var(--ink-soft);font-family:var(--mono);}
  .cov-badge{font-size:.71rem;font-family:var(--mono);}

  .dropzone{border:1.5px dashed #c4ccd6;border-radius:14px;padding:22px 18px;text-align:center;background:#fbfcfd;cursor:pointer;transition:border-color .15s ease,background .15s ease,box-shadow .15s ease;}
  .dropzone:hover{border-color:var(--autosr);box-shadow:0 0 0 3px rgba(33,95,206,.06);}
  .dropzone.drag{border-color:var(--fpt);background:#fff6f1;box-shadow:0 0 0 3px rgba(232,96,26,.08);}
  .dropzone-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:13px;}
  .dropzone-actions .btn{min-width:126px;}
  .folder-rule{margin-top:10px;padding:9px 12px;border-radius:10px;background:#f4f7fc;border:1px solid #e1e8f3;text-align:left;}
  .folder-picker-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;}
  .folder-picker-wrap input[type=&quot;file&quot;]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px;}
  .folder-rule code{white-space:nowrap;}
  .note{font-size:.78rem;color:var(--ink-soft);line-height:1.6;}
  .note code{background:#eef1f6;color:#3a4453;padding:1px 5px;border-radius:5px;font-size:.92em;}

  .topic-tabs{display:flex;flex-direction:column;gap:10px;}
  .tab-group{display:flex;align-items:flex-start;gap:12px;}
  .tab-group-label{flex:0 0 128px;padding-top:8px;font-family:var(--mono);font-size:.63rem;letter-spacing:.08em;
    text-transform:uppercase;font-weight:600;color:#9aa3b0;line-height:1.3;}
  .tab-group-items{display:flex;flex-wrap:wrap;gap:7px;flex:1;min-width:0;}
  .topic-tab.is-empty{opacity:.45;}
  .topic-tab.is-empty.active{opacity:1;}
  @media(max-width:820px){.tab-group{flex-direction:column;gap:4px}.tab-group-label{flex:none;padding-top:0}}
  .topic-tab{border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;color:#344050;font-size:.85rem;transition:all .12s ease;}
  .topic-tab:hover{border-color:var(--fpt);}
  .topic-tab.active{background:var(--fpt);border-color:var(--fpt);color:#fff;box-shadow:0 3px 10px -2px rgba(232,96,26,.45);}
  .topic-tab .small{font-weight:600;opacity:.82;font-family:var(--mono);}

  details&gt;summary{cursor:pointer;font-size:.81rem;font-weight:700;color:var(--autosr);list-style:none;}
  details&gt;summary::-webkit-details-marker{display:none;}
  details&gt;summary::before{content:&quot;▸ &quot;;display:inline-block;transition:transform .15s ease;}
  details[open]&gt;summary::before{content:&quot;▾ &quot;;}
  details[open]&gt;summary{margin-bottom:2px;}

  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;height:100%;}
  .chart-card.channel-card{cursor:pointer;transition:box-shadow .15s ease,border-color .15s ease;}
  .chart-card.channel-card:hover{box-shadow:var(--shadow);border-color:var(--line-strong);}
  .chart-title{font-size:.82rem;font-weight:700;color:var(--ink);margin-bottom:12px;}
  .cmp-up{color:var(--self);font-weight:700;}
  .cmp-down{color:#c0392b;font-weight:700;}
  .chart-wrap{position:relative;height:260px;}

  .jumpnav{position:sticky;top:0;z-index:20;background:rgba(242,244,247,.94);backdrop-filter:saturate(180%) blur(10px);border:1px solid var(--line-strong);border-radius:12px;margin-bottom:18px;padding:9px 14px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
  .jumpnav a{font-size:.76rem;font-weight:600;color:var(--ink-soft);text-decoration:none;padding:5px 10px;border-radius:7px;white-space:nowrap;}
  .jumpnav a:hover{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);}

  .btn-outline-secondary{font-weight:600;border-color:var(--line-strong);}
  ::-webkit-scrollbar{height:9px;width:9px;} ::-webkit-scrollbar-thumb{background:#d3d9e0;border-radius:99px;} ::-webkit-scrollbar-thumb:hover{background:#b9c1cb;}


  .data-update-bar{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#fffdfd,#f7fbff);}
  .data-update-bar .control{min-width:190px;}
  .data-update-bar label{display:block;font-size:.7rem;font-weight:800;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  .data-update-bar .form-select{font-size:.78rem;}
  .storage-actions{display:flex;flex-wrap:wrap;gap:6px;}
  .storage-status{font-size:.74rem;color:var(--ink-soft);line-height:1.45;flex-basis:100%;}
  .storage-status.ok{color:#27745a}.storage-status.warn{color:#a96313}.storage-status.err{color:#b54747}
  .import-warning{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff6e8;border:1px solid #f2d7aa;color:#8a5a13;font-size:.75rem;line-height:1.5;}
  .import-warning:empty{display:none;}

  .control-center{padding:14px 16px;}
  .control-menu{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:12px;background:#f7f9fc;}
  .control-menu .btn{border-color:#d9e1ec;background:#fff;color:#536681;font-size:.73rem;font-weight:700;}
  .control-menu .btn.active{background:#eaf2fd;border-color:#a9c4e9;color:#416d9f;box-shadow:0 2px 8px rgba(65,109,159,.08);}
  .control-menu .btn .chip-status{display:inline-block;margin-left:7px;padding-left:7px;border-left:1px solid #dde5f0;
    font-weight:600;font-size:.69rem;color:#8794a8;font-family:var(--mono);max-width:210px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;}
  .control-menu .btn .chip-status:empty{display:none;}
  .control-panels{display:grid;gap:9px;margin-top:9px;}
  details.control-panel{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;}
  /* Chip ở trên đã đóng vai trò menu. Trước đây mỗi panel còn hiện thêm 1 dòng summary trải rộng
     =&gt; 5 chip + 5 dòng trùng tên, tốn ~300px trước khi tới nội dung. Panel đóng nay ẩn hoàn toàn. */
  details.control-panel:not([open]){display:none;}
  details.control-panel&gt;summary{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 13px;list-style:none;cursor:pointer;font-size:.76rem;font-weight:800;color:#52657f;}
  details.control-panel&gt;summary::-webkit-details-marker{display:none;}
  details.control-panel&gt;summary::before{content:&quot;⌄&quot;;font-size:.95rem;color:#8aa2c0;}
  details.control-panel[open]&gt;summary{border-bottom:1px solid var(--line);background:#f8fafc;}
  .control-panel-body{padding:12px 13px;}
  .control-summary-text{margin-left:auto;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#7b879a;text-align:right;}
  .compact-controls{display:flex;flex-wrap:wrap;align-items:end;gap:10px;}
  .compact-controls .control{min-width:165px;}
  .compact-controls label{display:block;font-size:.68rem;font-weight:800;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.035em;}
  select option:disabled{color:#b7c0cd;background:#f3f5f8;}
  .period-unavailable-note{font-size:.68rem;color:#8a96a8;margin-top:6px;}
  .control-panel .period-manager,.control-panel .package-manager{
    flex-basis:auto;margin:0;padding:0;border:0;background:transparent;
  }
  .warning-always{margin-top:9px;}
  .compare-period-head{font-size:.68rem;line-height:1.35;max-width:190px;white-space:normal;}

  /* ===== Tool failure &amp; stamp monitoring ===== */
  .tool-health-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;margin-bottom:14px;}
  .tool-health-filters .control{min-width:165px;}
  .tool-health-filters .control.grow{flex:1 1 260px;}
  .tool-health-filters label{display:block;font-size:.67rem;font-weight:800;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  .tool-health-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  .tool-health-kpi{border:1px solid var(--line);border-left:3px solid #91a4bd;border-radius:11px;padding:13px 14px;background:#fff;box-shadow:var(--shadow-sm);}
  .tool-health-kpi.fail{border-left-color:#d0605b;}
  .tool-health-kpi.missing{border-left-color:#e0a34a;}
  .tool-health-kpi.invalid{border-left-color:#9a78cb;}
  .tool-health-kpi.good{border-left-color:var(--self);}
  .tool-health-kpi .label{font-size:.7rem;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .tool-health-kpi .value{font:700 1.55rem/1.1 var(--mono);color:var(--ink);}
  .tool-health-kpi .sub{font-size:.67rem;color:var(--ink-soft);margin-top:4px;}
  .tool-health-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:.67rem;font-weight:800;white-space:nowrap;}
  .tool-health-badge.fail{background:#fdebea;color:#a3433f;}
  .tool-health-badge.missing{background:#fff2da;color:#95631b;}
  .tool-health-badge.invalid{background:#f1eafa;color:#7555a5;}
  .tool-health-badge.valid{background:#e7f6ef;color:#31775f;}
  .tool-health-badge.other{background:#edf1f6;color:#6f7e92;}
  .tool-health-section{margin-top:16px;}
  .tool-health-section h3{display:flex;align-items:center;gap:8px;}
  .tool-health-table-wrap{max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:11px;}
  .tool-health-table-wrap table{margin:0;}
  .tool-health-table-wrap thead th{position:sticky;top:0;z-index:3;background:#f3f6fa;}
  .tool-status-cell{max-width:520px;white-space:normal;word-break:break-word;font-family:var(--mono);font-size:.7rem;}
  .tool-name-cell{max-width:330px;word-break:break-word;}
  @media(max-width:1000px){.tool-health-kpis{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:620px){.tool-health-kpis{grid-template-columns:1fr;}}

  @media print{.no-print,.jumpnav{display:none!important;}body{background:#fff;}.card-sec{border:none;box-shadow:none;padding:8px 0;}}

  /* ===== Pastel operations dashboard ===== */
  :root{
    --ink:#26334d; --ink-soft:#71809a; --paper:#f4f7fb; --card:#ffffff;
    --line:#e5eaf2; --line-strong:#d8dfeb;
    --self:#57b894; --self-bg:#eaf8f2; --self-ink:#28775c;
    --autosr:#6d9fe8; --autosr-bg:#edf4ff; --autosr-ink:#416fae;
    --agent:#f2a36f; --agent-bg:#fff2e9; --agent-ink:#ad6337;
    --other:#a9b4c6; --other-bg:#f1f4f8; --fpt:#f39a70;
    --shadow:0 10px 28px -22px rgba(39,55,86,.38),0 2px 8px rgba(55,70,100,.05);
    --shadow-sm:0 4px 14px -10px rgba(39,55,86,.25);
  }
  body{background:linear-gradient(180deg,#f7f9fc 0%,#f2f6fb 55%,#f8fafc 100%);}
  .brandbar{height:5px;background:linear-gradient(90deg,#8ed8d1,#7fc8e8,#a8a4e6,#f2bd83,#f6a884);}
  h1 .badge-daisy{background:linear-gradient(135deg,#76cfc5,#7aaee8);box-shadow:0 8px 18px -14px rgba(79,129,190,.6);}
  .card-sec,.chart-card{border-color:var(--line);box-shadow:var(--shadow);}
  .topic-tab.active{background:#8da9df;border-color:#8da9df;box-shadow:none;}
  .jumpnav{background:rgba(248,250,253,.93);border-color:var(--line);}
  .dropzone{background:#fbfcfe;border-color:#cfd9e8;}
  .dropzone:hover{border-color:#90b1df;box-shadow:0 0 0 3px rgba(126,165,221,.10);}

  .ops-dashboard{display:grid;gap:14px;}
  .ops-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
  .ss-kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  /* Thẻ KPI: nền trắng + viền trái mang NGHĨA, đồng bộ với stackbar/donut (xanh lá = Selfservice,
     xanh dương = AutoSR, cam = SOC Agent). Nền tô đậm chỉ dùng khi vượt ngưỡng cảnh báo,
     để màu mã hoá trạng thái chứ không phải trang trí. */
  .ops-kpi{position:relative;min-height:126px;border-radius:12px;padding:16px 18px 12px;overflow:hidden;
    background:var(--card);border:1px solid var(--line);border-left:3px solid #9aa8bb;
    box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,transform .15s ease;}
  .ops-kpi:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .ops-kpi.tone-neutral{border-left-color:#9aa8bb;}
  .ops-kpi.tone-self{border-left-color:var(--self);}
  .ops-kpi.tone-autosr{border-left-color:var(--autosr);}
  .ops-kpi.tone-agent{border-left-color:var(--agent);}
  .ops-kpi.tone-alert{border-left-color:#c0392b;background:#fdf3f2;border-color:#f2d5d1;}
  .ops-kpi.tone-alert .value{color:#a5342a;}
  .ops-kpi .label{font-size:.72rem;font-weight:700;color:var(--ink-soft);margin-bottom:7px;}
  .ops-kpi .value{font:700 1.95rem/1.05 var(--mono);letter-spacing:-.04em;color:var(--ink);}
  .ops-kpi .sub{font-size:.7rem;color:var(--ink-soft);margin-top:5px;}
  .ops-kpi .spark{height:40px;margin-top:5px;}
  .ops-panel{background:#fff;border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);padding:16px 17px;min-width:0;}
  .ops-panel-title{font-size:.8rem;font-weight:700;color:#617795;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .ops-main-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(290px,1fr);gap:14px;}
  .ops-bottom-grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,1.45fr) minmax(220px,1fr) minmax(220px,1fr);gap:14px;}
  .ops-chart-lg{height:275px;position:relative;}
  .ops-chart-md{height:225px;position:relative;}
  .ops-chart-sm{height:185px;position:relative;}
  .ss-equal-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;}
  .ss-summary-grid{display:grid;grid-template-columns:minmax(230px,.9fr) minmax(0,1.35fr) minmax(280px,1fr);gap:14px;}
  .ss-health-wrap{overflow:auto;}
  .ss-health-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.76rem;}
  .ss-health-table th{padding:9px 10px;border-bottom:1px solid #e5eaf1;color:#69788e;font-weight:700;white-space:nowrap;}
  .ss-health-table td{padding:10px;border-bottom:1px solid #edf1f5;vertical-align:middle;}
  .ss-health-table tbody tr:last-child td{border-bottom:0;}
  .ss-rate-cell{min-width:145px;}
  .ss-rate-track{height:7px;border-radius:99px;background:#edf1f6;overflow:hidden;margin-top:5px;}
  .ss-rate-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#74c7b0,#729fe1);}
  .ss-status{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:.68rem;font-weight:700;white-space:nowrap;}
  .ss-status.good{background:#e7f6ef;color:#31775f;}
  .ss-status.watch{background:#fff3dd;color:#9a681e;}
  .ss-status.risk{background:#fde9e8;color:#a24d49;}
  .ss-status.empty{background:#edf1f6;color:#78869a;}
  .ops-switch{display:inline-flex;background:#f1f5fa;border:1px solid #e1e7ef;border-radius:999px;padding:2px;gap:2px;}
  .ops-switch button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font-size:.68rem;font-weight:700;color:#75829a;}
  .ops-switch button.active{background:#fff;color:#4d6f9e;box-shadow:0 2px 8px rgba(69,88,120,.10);}
  .ops-table{width:100%;font-size:.72rem;border-collapse:collapse;}
  .ops-table th{font-size:.62rem;text-transform:uppercase;letter-spacing:.035em;color:#7a899f;background:#f6f8fb;padding:7px 6px;border-bottom:1px solid #e3e8ef;white-space:nowrap;}
  .ops-table td{padding:7px 6px;border-bottom:1px solid #eef1f5;color:#536178;vertical-align:middle;}
  .ops-table tbody tr:last-child td{border-bottom:0;}
  .ops-table .strong{font-weight:800;color:#30425e;}
  .metric-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:999px;background:#f1f5fa;font:600 .66rem var(--mono);}
  .health-row{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:9px 0;border-bottom:1px solid #edf1f5;}
  .health-row:last-child{border-bottom:0;}
  .health-row .name{font-size:.73rem;font-weight:700;color:#506079;}
  .health-row .val{font:700 .76rem var(--mono);color:#354964;}
  .health-row .bar{grid-column:1/-1;height:6px;border-radius:99px;background:#edf1f6;overflow:hidden;}
  .health-row .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#89cfc2,#8fafe3);}
  .ops-detail-wrap{margin-top:14px;border-top:1px solid #e8edf4;padding-top:14px;}
  .ops-empty{display:flex;align-items:center;justify-content:center;min-height:180px;color:#8b96a7;font-size:.78rem;}
  .ops-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.68rem;color:#6f7d91;margin-top:8px;}
  .ops-legend span{display:inline-flex;align-items:center;gap:5px;}.ops-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}


  /* ===== Selfservice monthly summary + recent 7 days ===== */
  .ss-month-summary{background:linear-gradient(135deg,#fff 0%,#f7fbff 52%,#f7fcfa 100%);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);}
  .ss-month-summary-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .ss-month-summary-title{font-size:.92rem;font-weight:900;color:#30425e;letter-spacing:-.01em;}
  .ss-month-summary-period{font:700 .66rem var(--mono);color:#617795;background:#edf3fb;border:1px solid #dde7f4;padding:4px 8px;border-radius:999px;white-space:nowrap;}
  .ss-month-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;}
